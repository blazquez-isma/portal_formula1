<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Votar</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div class="container">
    <div th:replace="~{fragmentos/menu :: menu('Votar')}"></div>

    <div th:if="${error != null}" class='alert alert-danger' th:text="${error}" role='alert'></div>
    <div th:if="${success != null}" class='alert alert-success' th:text="${success}" role='alert'></div>

    <div class="form-container">
        <form th:action="@{/votaciones/votar}" th:object="${voto}" method="post" novalidate>

            <h3>Información de la Votación</h3>
            <p><strong>Título:</strong> <span th:text="${votacion.titulo}"></span></p>
            <p><strong>Fecha Límite:</strong> <span th:text="${#dates.format(votacion.fechaLimite, 'dd/MM/yyyy HH:mm')}"></span></p>
            <p><strong>Descripción:</strong> <span th:text="${votacion.descripcion}"></span></p>

            <h3>Pilotos</h3>
            <div class="form-group">
                <ul class="list-group">
                    <li class="list-group-item" th:each="piloto : ${votacion.pilotos}">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="pilotoId" th:value="${piloto.id}" required />
                            <label class="form-check-label">
                                <img th:src="@{/pilotos/verImagen/{filename}(filename=${piloto.foto})}" class="img-thumbnail" style="max-width: 70px;" alt="Foto del Piloto">
                                <span th:text="${piloto.nombre} + ' ' + ${piloto.apellidos} + ' (' + ${piloto.siglas} + ') - ' + ${piloto.dorsal}"></span>
                            </label>
                        </div>
                    </li>
                </ul>
            </div>

            <input type="hidden" name="votacionId" th:value="${votacion.id}" />

            <div class="form-group">
                <label for="nombreVotante">Nombre:</label>
                <input type="text" id="nombreVotante" th:field="*{nombreVotante}" class="form-control" required />
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" th:field="*{email}" class="form-control" required />
            </div>

            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-primary">Votar</button>
                <nav th:replace="~{fragmentos/backButtons :: buttons}"></nav>
            </div>
        </form>
    </div>

    <div th:replace="~{fragmentos/footer :: footer}"></div>
</div>
<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/bootstrap.min.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/goBack.js}"></script>
</body>
</html>
