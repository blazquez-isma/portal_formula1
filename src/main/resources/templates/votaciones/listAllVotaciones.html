<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Listado de Votaciones</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div class="container">
    <div th:replace="~{fragmentos/menu :: menu(${titulo})}"></div>

    <div th:if="${error != null}" class='alert alert-danger' th:text="${error}" role='alert'></div>
    <div th:if="${success != null}" class='alert alert-success' th:text="${success}" role='alert'></div>

    <div class="container my-4">
        <table class="table table-striped">
            <thead>
            <tr>
                <th class="col-3">
                    <a th:href="@{/votaciones(page=${currentPage}, size=${elements.size}, sortField='titulo', sortDir=${sortField == 'titulo' ? reverseSortDir : 'asc'})}">
                        Título
                        <span th:if="${sortField == 'titulo'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                    </a>
                </th>
                <th class="col-2">
                    <a th:href="@{/votaciones(page=${currentPage}, size=${elements.size}, sortField='fechaLimite', sortDir=${sortField == 'fechaLimite' ? reverseSortDir : 'asc'})}">
                        Fecha Límite
                        <span th:if="${sortField == 'fechaLimite'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                    </a>
                </th>
                <th class="col-7">Descripción</th>
                <th sec:authorize="hasRole('ROLE_ADMINISTRADOR')">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="votacion : ${elements.content}">
                <td class="col-3"><a th:href="@{/votaciones/verVotacion/{idVotacion}(idVotacion=${votacion.id})}" th:text="${votacion.titulo}"></a></td>
                <td class="col-2" th:text="${#dates.format(votacion.fechaLimite, 'dd/MM/yyyy HH:mm')}"></td>
                <td class="col-7" th:text="${votacion.descripcion}"></td>
                <td>
                    <div sec:authorize="hasRole('ROLE_ADMINISTRADOR')">
<!--                        <a th:href="@{/votaciones/editarVotacion/{idVotacion}(idVotacion=${votacion.id})}" class="btn btn-warning btn-sm mx-1">Editar</a>-->
                        <a sec:authorize="hasRole('ROLE_ADMINISTRADOR')" th:href="@{/votaciones/eliminarVotacion/{idVotacion}(idVotacion=${votacion.id})}"
                           th:text="'Borrar'" onclick="return confirm('¿Estas seguro?')" class="btn btn-danger btn-sm mx-1" role="button" title="Eliminar la Votación.">
                            <i class="fas fa-trash" aria-hidden="true"></i></a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
        <div th:if="${elements.totalElements > 0}">
            <nav aria-label="Page navigation">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${elements.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/votaciones(page=${elements.number - 1}, size=${elements.size}, sortField=${sortField}, sortDir=${sortDir})}" aria-label="Previous">
                            <span aria-hidden="true">&laquo;</span>
                        </a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(1, elements.totalPages)}" th:classappend="${i == elements.number + 1} ? 'active'">
                        <a class="page-link" th:href="@{/votaciones(page=${i - 1}, size=${elements.size}, sortField=${sortField}, sortDir=${sortDir})}" th:text="${i}"></a>
                    </li>
                    <li class="page-item" th:classappend="${elements.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/votaciones(page=${elements.number + 1}, size=${elements.size}, sortField=${sortField}, sortDir=${sortDir})}" aria-label="Next">
                            <span aria-hidden="true">&raquo;</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
    <div class="d-flex justify-content-between">
        <nav th:replace="~{fragmentos/backButtons :: buttons}"></nav>
    </div>
    <div th:replace="~{fragmentos/footer :: footer}"></div>
</div>
<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/bootstrap.min.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/goBack.js}"></script>
</body>
</html>
