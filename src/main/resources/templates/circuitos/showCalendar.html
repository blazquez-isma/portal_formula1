<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Calendario de Circuitos</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div class="container">
    <div th:replace="~{fragmentos/menu :: menu(${titulo})}"></div>

    <!-- Botones de Mes -->
    <div class="my-3 d-flex justify-content-center">
        <div class="btn-group">
            <a th:each="mes, iter : ${nombresMeses}"
               th:href="@{/circuitos/verCalendario(mes=${iter.index})}"
               class="btn btn-outline-primary"
               th:classappend="${mesSeleccionado == iter.index} ? 'active'">
                <span th:text="${mes}"></span>
            </a>
        </div>
    </div>

    <!-- Circuitos por Mes -->
    <div class="my-4" th:if="${mesSeleccionado != null}">
        <h2 class="text-center my-4" th:text="'Circuitos en ' + ${nombresMeses[mesSeleccionado]}"></h2>
        <table class="table table-striped">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Ciudad</th>
                <th>País</th>
                <th>Fecha</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="circuito : ${circuitosPorMes}">
                <td><a th:href="@{/circuitos/verCircuito/{idCircuito}(idCircuito=${circuito.id})}" th:text="${circuito.nombre}"></a></td>
                <td th:text="${circuito.ciudad}"></td>
                <td th:text="${circuito.pais}"></td>
                <td th:text="${#dates.format(circuito.fechaCalendario, 'dd-MM-yyyy')}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Mensaje si no se selecciona un mes -->
    <div th:if="${mesSeleccionado == null}">
        <h4>Selecciona un mes para ver los circuitos.</h4>
    </div>

    <div th:replace="~{fragmentos/footer :: footer}"></div>
</div>
<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/bootstrap.min.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/goBack.js}"></script>
</body>
</html>
