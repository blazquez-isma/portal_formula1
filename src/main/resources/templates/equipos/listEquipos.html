<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Ver Equipos</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div class="container">
    <div th:replace="~{fragmentos/menu :: menu(${titulo})}"></div>

    <div th:if="${error != null}" class='alert alert-danger' th:text="${error}" role='alert'></div>
    <div th:if="${success != null}" class='alert alert-success' th:text="${success}" role='alert'></div>

    <div class="container my-4">
        <table class="table table-striped">
            <thead>
            <tr>
                <th>
                    <a th:href="@{/equipos(page=${currentPage}, size=${elements.size}, sortField='nombre', sortDir=${sortField == 'nombre' ? reverseSortDir : 'asc'})}">
                        Nombre
                        <span th:if="${sortField == 'nombre'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                    </a>
                </th>
                <th>
                    <a th:href="@{/equipos(page=${currentPage}, size=${elements.size}, sortField='twitter', sortDir=${sortField == 'twitter' ? reverseSortDir : 'asc'})}">
                        Twitter
                        <span th:if="${sortField == 'twitter'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                    </a>
                </th>
<!--                <th sec:authorize="hasRole('ROLE_ADMINISTRADOR')">Acciones</th>-->
            </tr>
            </thead>
            <tbody>
            <tr th:each="equipo : ${elements.content}">
                <td><a th:href="@{/equipos/verEquipo/{idEquipo}(idEquipo=${equipo.id})}" th:text="${equipo.nombre}"></a></td>
                <td th:text="${equipo.twitter}"></td>
<!--                <td>-->
<!--                    <div sec:authorize="hasRole('ROLE_ADMINISTRADOR')">-->
<!--                        <a th:href="@{/equipos/editarEquipo/{idEquipo}(idEquipo=${equipo.id})}" class="btn btn-warning">Editar</a>-->
<!--                        <a th:href="@{/equipos/borrarEquipo/{idEquipo}(idEquipo=${equipo.id})}" class="btn btn-danger" onclick="return confirm('¿Estás seguro?')">Borrar</a>-->
<!--                    </div>-->
<!--                </td>-->
            </tr>
            </tbody>
        </table>
        <div th:if="${elements.totalElements > 0}">
            <nav aria-label="Page navigation">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${elements.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/equipos(page=${elements.number - 1}, size=${elements.size}, sortField=${sortField}, sortDir=${sortDir})}" aria-label="Previous">
                            <span aria-hidden="true">&laquo;</span>
                        </a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(1, elements.totalPages)}" th:classappend="${i == elements.number + 1} ? 'active'">
                        <a class="page-link" th:href="@{/equipos(page=${i - 1}, size=${elements.size}, sortField=${sortField}, sortDir=${sortDir})}" th:text="${i}"></a>
                    </li>
                    <li class="page-item" th:classappend="${elements.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/equipos(page=${elements.number + 1}, size=${elements.size}, sortField=${sortField}, sortDir=${sortDir})}" aria-label="Next">
                            <span aria-hidden="true">&raquo;</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
    <div class="d-flex justify-content-between">
        <nav th:replace="~{fragmentos/backButtons :: buttons}"></nav>
    </div>
    <div th:replace="~{fragmentos/footer :: footer}"></div>
</div>
<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/bootstrap.min.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/goBack.js}"></script>
</body>
</html>
