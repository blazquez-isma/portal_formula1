<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mostrar Usuarios</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/bootstrap.min.css}">
    <style>
        .table th, .table td {
            width: 150px;
            text-align: center;
        }
        .table th[data-column="accion"], .table td[data-column="accion"] {
            width: 250px; /* Ajusta el ancho de la columna Acción */
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 5px;
        }
        .action-buttons button {
            width: 150px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<div class="container">
    <div th:replace="~{fragmentos/menu :: menu(${titulo})}"></div>

    <div th:if="${error != null}" class='alert alert-danger' th:text="${error}" role='alert'></div>
    <div th:if="${success != null}" class='alert alert-success' th:text="${success}" role='alert'></div>

    <div class="container my-4">
        <table class="table table-striped">
            <thead>
            <tr>
                <th>
                    <a th:href="@{${baseUrl}(page=${currentPage}, size=${elements.size}, sortField='nombre', sortDir=${sortField == 'nombre' ? reverseSortDir : 'asc'})}">
                        Nombre
                        <span th:if="${sortField == 'nombre'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                    </a>
                </th>
                <th>
                    <a th:href="@{${baseUrl}(page=${currentPage}, size=${elements.size}, sortField='nombreUsuario', sortDir=${sortField == 'nombreUsuario' ? reverseSortDir : 'asc'})}">
                        Nombre de Usuario
                        <span th:if="${sortField == 'nombreUsuario'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                    </a>
                </th>
                <th>
                    <a th:href="@{${baseUrl}(page=${currentPage}, size=${elements.size}, sortField='email', sortDir=${sortField == 'email' ? reverseSortDir : 'asc'})}">
                        Email
                        <span th:if="${sortField == 'email'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                    </a>
                </th>
                <th th:if="${isResponsableList != null && !isResponsableList}">
                    <a th:href="@{${baseUrl}(page=${currentPage}, size=${elements.size}, sortField='roles', sortDir=${sortField == 'roles' ? reverseSortDir : 'asc'})}">
                        Roles
                        <span th:if="${sortField == 'roles'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                    </a>
                </th>
                <th th:if="${isResponsableList != null && !isResponsableList}">
                    <a th:href="@{${baseUrl}(page=${currentPage}, size=${elements.size}, sortField='activo', sortDir=${sortField == 'activo' ? reverseSortDir : 'asc'})}">
                        Estado
                        <span th:if="${sortField == 'activo'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                    </a>
                </th>
                <th>Acción</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="usuario : ${elements.content}">
                <td data-column="nombre" th:text="${usuario.nombre}"></td>
                <td data-column="nombreUsuario" th:text="${usuario.nombreUsuario}"></td>
                <td data-column="email" th:text="${usuario.email}"></td>
                <td th:if="${isResponsableList != null && !isResponsableList}" data-column="roles">
                    <span th:each="rol : ${usuario.roles}" th:text="${rol.nombre} + ' '"></span>
                </td>
                <td th:if="${isResponsableList != null && !isResponsableList}" data-column="estado" th:text="${usuario.activo ? 'Activo' : 'No Activo'}" th:style="${usuario.activo ? 'color: green;' : 'color: red;'}"></td>
                <td>
                    <div class="action-buttons">
                        <form th:if="${isResponsableList != null && !isResponsableList && !usuario.activo}" th:action="@{/usuarios/activarUsuario}" method="post" style="display:inline;">
                            <input type="hidden" th:value="${usuario.id}" name="userId"/>
                            <button type="submit" class="btn btn-success">Activar</button>
                        </form>
                        <form th:if="${isResponsableList != null && !isResponsableList && !usuario.activo}" th:action="@{/usuarios/borrarUsuario}" method="post" style="display:inline;">
                            <input type="hidden" th:value="${usuario.id}" name="userId"/>
                            <button type="submit" class="btn btn-danger">Rechazar</button>
                        </form>
                        <form th:if="${isResponsableList != null && !isResponsableList && usuario.activo}" th:action="@{/usuarios/borrarUsuario}" method="post" th:id="'deleteForm-' + ${usuario.id}" style="display:inline;">
                            <input type="hidden" th:value="${usuario.id}" name="userId"/>
                            <button type="button" th:id="'deleteButton-' + ${usuario.id}" class="btn btn-danger" th:onclick="'confirmDelete(' + ${usuario.id} + ')'">Eliminar Usuario</button>
                            <button type="button" th:id="'confirmButton-' + ${usuario.id}" class="confirm-button btn btn-warning" th:onclick="'document.getElementById(\'deleteForm-' + ${usuario.id} + '\').submit()'" style="display:none;">Confirmar</button>
                            <button type="button" th:id="'cancelButton-' + ${usuario.id}" class="cancel-button btn btn-secondary" th:onclick="'cancelDelete(' + ${usuario.id} + ')'" style="display:none;">Cancelar</button>
                        </form>
                        <form th:if="${isResponsableList != null && isResponsableList}" th:action="@{/equipos/{idEquipo}/quitarResponsable/{idUsuario}(idEquipo=${idEquipo}, idUsuario=${usuario.id})}" method="post" th:id="'removeForm-' + ${usuario.id}" style="display:inline;">
                            <button type="button" th:id="'removeButton-' + ${usuario.id}" class="btn btn-danger" th:onclick="'confirmRemove(' + ${usuario.id} + ')'">Quitar</button>
                            <button type="button" th:id="'confirmRemoveButton-' + ${usuario.id}" class="confirm-button btn btn-warning" th:onclick="'document.getElementById(\'removeForm-' + ${usuario.id} + '\').submit()'" style="display:none;">Confirmar</button>
                            <button type="button" th:id="'cancelRemoveButton-' + ${usuario.id}" class="cancel-button btn btn-secondary" th:onclick="'cancelRemove(' + ${usuario.id} + ')'" style="display:none;">Cancelar</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
        <nav aria-label="Page navigation">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{${baseUrl}(page=${currentPage - 1}, size=${elements.size}, sortField=${sortField}, sortDir=${sortDir})}" aria-label="Previous">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, elements.totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{${baseUrl}(page=${i}, size=${elements.size}, sortField=${sortField}, sortDir=${sortDir})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage == elements.totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{${baseUrl}(page=${currentPage + 1}, size=${elements.size}, sortField=${sortField}, sortDir=${sortDir})}" aria-label="Next">
                        <span aria-hidden="true">&raquo;</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
    <div class="d-flex justify-content-between">
        <nav th:replace="~{fragmentos/backButtons :: buttons}"></nav>
    </div>
    <div th:replace="~{fragmentos/footer :: footer}"></div>
</div>
<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/bootstrap.min.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/goBack.js}"></script>
<script>
    function confirmDelete(userId) {
        var deleteButton = document.getElementById('deleteButton-' + userId);
        var confirmButton = document.getElementById('confirmButton-' + userId);
        var cancelButton = document.getElementById('cancelButton-' + userId);

        if (deleteButton && confirmButton && cancelButton) {
            deleteButton.style.display = 'none';
            confirmButton.style.display = 'inline';
            cancelButton.style.display = 'inline';
        } else {
            console.error('Element not found for userId:', userId);
        }
    }

    function cancelDelete(userId) {
        var deleteButton = document.getElementById('deleteButton-' + userId);
        var confirmButton = document.getElementById('confirmButton-' + userId);
        var cancelButton = document.getElementById('cancelButton-' + userId);

        if (deleteButton && confirmButton && cancelButton) {
            deleteButton.style.display = 'inline';
            confirmButton.style.display = 'none';
            cancelButton.style.display = 'none';
        } else {
            console.error('Element not found for userId:', userId);
        }
    }

    function confirmRemove(userId) {
        var removeButton = document.getElementById('removeButton-' + userId);
        var confirmRemoveButton = document.getElementById('confirmRemoveButton-' + userId);
        var cancelRemoveButton = document.getElementById('cancelRemoveButton-' + userId);

        if (removeButton && confirmRemoveButton && cancelRemoveButton) {
            removeButton.style.display = 'none';
            confirmRemoveButton.style.display = 'inline';
            cancelRemoveButton.style.display = 'inline';
        } else {
            console.error('Element not found for userId:', userId);
        }
    }

    function cancelRemove(userId) {
        var removeButton = document.getElementById('removeButton-' + userId);
        var confirmRemoveButton = document.getElementById('confirmRemoveButton-' + userId);
        var cancelRemoveButton = document.getElementById('cancelRemoveButton-' + userId);

        if (removeButton && confirmRemoveButton && cancelRemoveButton) {
            removeButton.style.display = 'inline';
            confirmRemoveButton.style.display = 'none';
            cancelRemoveButton.style.display = 'none';
        } else {
            console.error('Element not found for userId:', userId);
        }
    }
</script>
</body>
</html>
