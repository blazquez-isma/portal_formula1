<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Simulación</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div class="container">
    <div th:replace="~{fragmentos/menu :: menu(${titulo})}"></div>

    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/simulaciones/combustible}" method="post" class="mb-5">
        <h4>Simulación de Consumo de Combustible</h4>
        <div class="form-group">
            <label for="cocheCombustible">Coche:</label>
            <select id="cocheCombustible" name="cocheId" class="form-control" required>
                <option th:each="coche : ${coches}" th:value="${coche.id}" th:text="${coche.nombre}"></option>
            </select>
        </div>
        <div class="form-group">
            <label for="circuitoCombustible">Circuito:</label>
            <select id="circuitoCombustible" name="circuitoId" class="form-control" required>
                <option th:each="circuito : ${circuitos}" th:value="${circuito.id}" th:text="${circuito.nombre}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Calcular Consumo</button>
    </form>

    <form th:action="@{/simulaciones/ers}" method="post">
        <h4>Simulación de Recuperación de Energía (ERS)</h4>
        <div class="form-group">
            <label for="cocheERS">Coche:</label>
            <select id="cocheERS" name="cocheId" class="form-control" required>
                <option th:each="coche : ${coches}" th:value="${coche.id}" th:text="${coche.nombre}"></option>
            </select>
        </div>
        <div class="form-group">
            <label for="circuitoERS">Circuito:</label>
            <select id="circuitoERS" name="circuitoId" class="form-control" required>
                <option th:each="circuito : ${circuitos}" th:value="${circuito.id}" th:text="${circuito.nombre}"></option>
            </select>
        </div>
        <div class="form-group">
            <label for="estiloConduccion">Estilo de Conducción:</label>
            <select id="estiloConduccion" name="estiloConduccion" class="form-control" required>
                <option th:each="estilo : ${estilosConduccion}" th:value="${estilo.name()}" th:text="${estilo.name()}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Calcular ERS</button>
    </form>

    <div th:replace="~{fragmentos/footer :: footer}"></div>
</div>
<script th:src="@{/js/bootstrap.min.js}"></script>
</body>
</html>
