<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Piloto</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div class="container">
    <div th:replace="~{fragmentos/menu :: menu(${titulo})}"></div>

    <div th:if="${error != null}" class='alert alert-danger' th:text="${error}" role='alert'></div>
    <div th:if="${success != null}" class='alert alert-success' th:text="${success}" role='alert'></div>

    <div class="form-container">
        <form th:action="@{/pilotos/guardarPiloto}" th:object="${piloto}" method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" th:field="*{nombre}" class="form-control" maxlength="100" required />
            </div>
            <div class="form-group">
                <label for="apellidos">Apellidos:</label>
                <input type="text" id="apellidos" th:field="*{apellidos}" class="form-control" maxlength="100" required />
            </div>
            <div class="form-group">
                <label for="siglas">Siglas:</label>
                <input type="text" id="siglas" th:field="*{siglas}" class="form-control" maxlength="10" required />
            </div>
            <div class="form-group">
                <label for="dorsal">Dorsal:</label>
                <input type="number" id="dorsal" th:field="*{dorsal}" class="form-control" required />
            </div>
            <div class="form-group">
                <label for="pais">País:</label>
                <input type="text" id="pais" th:field="*{pais}" class="form-control" maxlength="50" required />
            </div>
            <div class="form-group">
                <label for="twitter">Twitter:</label>
                <input type="text" id="twitter" th:field="*{twitter}" class="form-control" maxlength="50" required />
            </div>
            <div class="form-group">
                <label for="file">Foto:</label>
                <input type="file" id="file" name="file" class="form-control"/>
            </div>

            <input type="hidden" th:field="*{id}"/>
            <input type="hidden" th:field="*{equipo.id}" th:value="${equipo.id}"/>

            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <nav th:replace="~{fragmentos/backButtons :: buttons}"></nav>
            </div>
        </form>
    </div>

    <div th:replace="~{fragmentos/footer :: footer}"></div>
</div>
<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/bootstrap.min.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/goBack.js}"></script>
</body>
</html>
